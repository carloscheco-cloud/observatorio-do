name: Senate reconstruction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/modules/senate_reconstruction.py"
      - "pyproject.toml"
      - ".github/workflows/senate-reconstruction.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OED
        run: pip install .
      - name: Reconstruct Senate sources
        run: python -m app.modules.senate_reconstruction
        working-directory: backend
      - name: Persist reconstruction outputs
        run: |
          git config user.name "oed-reconstruction-bot"
          git config user.email "oed-bot@users.noreply.github.com"
          git add backend/data/oed/senate
          if git diff --cached --quiet; then
            echo "No reconstructed dataset changes"
          else
            git commit -m "data: capture Senate reconstruction run"
            git push
          fi
      - name: Validate reconstruction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("backend/data/oed/senate")
          sessions = json.loads((root / "senate-attendance-sessions-2026.json").read_text())
          records = json.loads((root / "senate-attendance-records-2026.json").read_text())
          summary = json.loads((root / "senate-attendance-summary-2026.json").read_text())
          validation = json.loads((root / "senate-attendance-validation-2026.json").read_text())
          sources = json.loads((root / "senate-legislative-source-index.json").read_text())

          session_numbers = [row["session"] for row in sessions]
          print(f"attendance sessions discovered: {len(sessions)} -> {session_numbers}")
          print(f"attendance records: {len(records)}")
          print(f"senators summarized: {len(summary)}")
          print("known-cut validation:", validation)
          print("legislative source documents:", {k: len(v) for k, v in sources.items()})

          if session_numbers != list(range(101, 127)):
              raise SystemExit(f"Expected sessions 101..126 exactly, got {session_numbers}")
          if len(records) != 32 * 26:
              raise SystemExit(f"Expected 832 session/senator records, got {len(records)}")
          if len(summary) != 32:
              raise SystemExit(f"Expected 32 senators, got {len(summary)}")
          unknown = [row for row in records if row["status"] == "unknown"]
          if unknown:
              raise SystemExit(f"Unclassified session records remain: {len(unknown)}")
          mismatches = [row for row in validation if not row["matches"]]
          if mismatches:
              raise SystemExit(f"Known 10-senator benchmark mismatch: {mismatches}")
          if not sources.get("approved") or not sources.get("expired"):
              raise SystemExit("Approved/perimidos source discovery returned no documents")
          PY
