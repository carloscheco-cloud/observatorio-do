name: Senate reconstruction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/modules/senate_reconstruction.py"
      - "backend/app/modules/senate_reconstruction_runner.py"
      - "pyproject.toml"
      - ".github/workflows/senate-reconstruction.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/modules/senate_reconstruction.py"
      - "backend/app/modules/senate_reconstruction_runner.py"
      - "pyproject.toml"
      - ".github/workflows/senate-reconstruction.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OED
        run: pip install .
      - name: Install scanned-PDF support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - name: Reconstruct Senate attendance
        run: |
          if [ -f app/modules/senate_reconstruction_runner.py ]; then
            python -m app.modules.senate_reconstruction_runner
          else
            python - <<'PY'
          from pathlib import Path
          from app.modules.senate_reconstruction import write_attendance_outputs
          write_attendance_outputs(Path("data/oed/senate"))
          PY
          fi
        working-directory: backend
      - name: Print reconstruction diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("backend/data/oed/senate")
          sessions = json.loads((root / "senate-attendance-sessions-2026.json").read_text())
          records = json.loads((root / "senate-attendance-records-2026.json").read_text())
          summary = json.loads((root / "senate-attendance-summary-2026.json").read_text())
          validation = json.loads((root / "senate-attendance-validation-2026.json").read_text())
          print("SESSIONS", [row["session"] for row in sessions])
          print("COUNTS", len(sessions), len(records), len(summary))
          print("SESSION_DISCREPANCY", json.dumps(validation["session_count_discrepancy"], ensure_ascii=False))
          unknown = [r for r in records if r["status"] == "unknown"]
          print("UNKNOWN_COUNT", len(unknown))
          print("UNKNOWN_SAMPLE", json.dumps(unknown[:50], ensure_ascii=False))
          PY
      - name: Persist reconstruction outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "oed-reconstruction-bot"
          git config user.email "oed-bot@users.noreply.github.com"
          git add backend/data/oed/senate
          if git diff --cached --quiet; then
            echo "No reconstructed dataset changes"
          else
            git commit -m "data: capture Senate attendance reconstruction"
            git push
          fi
      - name: Upload reconstruction artifact
        uses: actions/upload-artifact@v4
        with:
          name: senate-reconstruction
          path: backend/data/oed/senate
          if-no-files-found: error
      - name: Validate official attendance reconstruction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("backend/data/oed/senate")
          sessions = json.loads((root / "senate-attendance-sessions-2026.json").read_text())
          records = json.loads((root / "senate-attendance-records-2026.json").read_text())
          summary = json.loads((root / "senate-attendance-summary-2026.json").read_text())
          validation = json.loads((root / "senate-attendance-validation-2026.json").read_text())

          expected_sessions = list(range(101, 126))
          actual_sessions = [row["session"] for row in sessions]
          if actual_sessions != expected_sessions:
              raise SystemExit(f"Expected official sessions 101..125 exactly, got {actual_sessions}")
          if len(records) != 32 * 25:
              raise SystemExit(f"Expected 800 session/senator records, got {len(records)}")
          if len(summary) != 32:
              raise SystemExit(f"Expected 32 senators, got {len(summary)}")
          unknown = [row for row in records if row["status"] == "unknown"]
          if unknown:
              raise SystemExit(f"Unclassified official session records remain: {len(unknown)}; sample={unknown[:12]}")
          for senator_id, row in summary.items():
              if row["sessions_classified"] != 25:
                  raise SystemExit(f"{senator_id} has only {row['sessions_classified']} classified official sessions")
          discrepancy = validation["session_count_discrepancy"]
          if discrepancy["official_numbered_sessions"] != 25:
              raise SystemExit(f"Unexpected official session count metadata: {discrepancy}")
          print("Official 25-session primary-source matrix validated; press 26-session discrepancy retained separately.")
          PY
