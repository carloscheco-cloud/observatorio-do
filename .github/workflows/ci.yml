name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: observatorio_test
          POSTGRES_USER: observatorio
          POSTGRES_PASSWORD: observatorio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U observatorio -d observatorio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://observatorio:observatorio@localhost:5432/observatorio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m compileall -q backend
      - run: cd backend && alembic upgrade head
      - run: pytest
      - run: cd backend && alembic heads

